name: CCproject CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      model_source:
        description: "Model to evaluate (trained or untrained)"
        required: true
        type: choice
        options:
          - trained
          - untrained
        default: trained

permissions:
  contents: read

jobs:
  lint:
    name: 1. Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linter
        run: pip install ruff

      - name: Run lint checks
        run: |
          python -m compileall -q service tools training worker tests
          ruff check --select E9,F63,F7,F82 service tools training worker tests

  unit-tests:
    name: 2. Unit tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit test suite
        run: python -m unittest discover -s tests -v

  evaluation:
    name: 3. Model evaluation
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install inference dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.15.0 \
            --index-url https://download.pytorch.org/whl/cpu
          pip install transformers==5.22.1 tokenizers==0.23.3 safetensors

      - name: Download and verify model release
        run: |
          MODEL_URL="https://github.com/Trishanshv/CC-project/releases/download/v1.0/pythia-70m-v1.tar.gz"
          BACKUP_URL="https://github.com/rahul-singh92/NanoParse/releases/download/v1.0/pythia-70m-v1.tar.gz"

          if ! curl -fL "$MODEL_URL" -o pythia-70m-v1.tar.gz 2>/dev/null; then
            echo "Release asset not found on Trishanshv/CC-project, falling back to upstream mirror..."
            curl -fL "$BACKUP_URL" -o pythia-70m-v1.tar.gz
          fi

          echo "3b098817b3ab49b30b44cd2b6086b71b1ef7645542451883d54dfcfebab47bfe  pythia-70m-v1.tar.gz" \
            | sha256sum -c -

          mkdir -p /tmp/nanoparse-model
          tar -xzf pythia-70m-v1.tar.gz -C /tmp/nanoparse-model

      - name: Generate validation predictions
        env:
          TOKENIZERS_PARALLELISM: "false"
        run: |
          ARGS=()
          if [ "${{ github.event.inputs.model_source }}" = "untrained" ]; then
            ARGS+=(--random-init)
          fi

          python tools/predict.py \
            --model-dir /tmp/nanoparse-model \
            --output results/ci_predictions.jsonl \
            "${ARGS[@]}"

      - name: Evaluate model quality with score.py
        run: |
          python tools/score.py \
            results/ci_predictions.jsonl \
            data/validation.jsonl \
            --out results/ci_score.json

      - name: Upload evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ccproject-evaluation
          path: |
            results/ci_predictions.jsonl
            results/ci_score.json
          if-no-files-found: error

  quality-gate:
    name: 4. Quality gate
    needs: evaluation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download evaluation artifacts
        uses: actions/download-artifact@v4
        with:
          name: ccproject-evaluation
          path: results

      - name: Enforce 95% validity quality gate
        run: |
          python tools/score.py \
            results/ci_predictions.jsonl \
            data/validation.jsonl \
            --min-validity 95

  secret-scan:
    name: 5. Secret scan
    needs: quality-gate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install and Run Gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | tar -xz -C /tmp
          /tmp/gitleaks detect --source=. --verbose --redact
